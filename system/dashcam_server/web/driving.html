<!DOCTYPE tml>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Dashy by dragonpilot</title>
  <link rel="stylesheet" href="/css/driving.css" />
 </head>
 <body>
  <div id="app-container">
   <nav>
<!--    <button id="nav-files" class="">Files</button>-->
    <button id="nav-driving" style="display:none" class="active">Driving</button>
<!--    <button id="nav-local-settings" style="display:none">Local Settings</button>-->
   </nav>
   <main id="page-content" style="flex-grow:1;min-height:0">
    <div id="files-page" class="page active">
     <div id="files-breadcrumbs"></div>
     <table id="files-table">
      <thead>
       <tr>
        <th></th>
        <th>Name</th>
        <th>Last Modified</th>
        <th style="text-align:right">Size</th>
        <th></th>
       </tr>
      </thead>
      <tbody></tbody>
     </table>
    </div>
    <div id="driving-page" class="page">
     <div id="driving-page-content">
      <video id="videoPlayer" autoplay="" playsinline="" muted=""></video>
      <canvas id="uiCanvas"></canvas>
     </div>
    </div>
    <div id="local-settings-page" class="page">
     <div class="settings-page-wrapper">
      <h1>Local Settings</h1>
      <div id="local-settings-content"></div>
     </div>
    </div>
   </main>
  </div>
  <script src="/js/app.js"></script>
 </body>
</html>
